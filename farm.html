<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>그림 농장 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 화면 전체가 3D 무대. 조작은 아래 도크, 색칠은 오른쪽 패널(좁은 화면에서는 아래 시트). 한 가지 어두운 무대 톤으로 고정. */
:root {
  color-scheme: dark;
  --bg: #10131a; --panel: rgba(17, 21, 29, 0.82); --panel-solid: #161b25; --line: rgba(255, 255, 255, 0.16);
  --fg: #f3efe6; --muted: #bdb7a9; --accent: #f2c14e; --accent-ink: #1c1606; --danger: #ffb4a2;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button, label.btn { font: inherit; color: var(--fg); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover, label.btn:hover { background: rgba(255, 255, 255, 0.14); }
button:focus-visible, label.btn:focus-within, .swatch:focus-visible, .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary, label.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.primary:hover, label.btn.primary:hover { background: #ffd369; }
button[aria-pressed="true"] { background: var(--fg); color: #14171d; border-color: transparent; font-weight: 700; }

#intro { box-sizing: border-box; position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: min(340px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(8px); }
#intro h1 { font-size: 18px; margin: 0 0 4px; font-weight: 700; }
#intro p { margin: 0; color: var(--muted); line-height: 1.5; }
#intro ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
#intro ol b { color: var(--accent); font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }
#intro .note { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }

#dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; background: linear-gradient(to top, rgba(10, 12, 17, 0.85), rgba(10, 12, 17, 0)); }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.group > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; }

#toast { box-sizing: border-box; position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; max-width: calc(100% - 32px); text-align: center; }
#toast.err { color: var(--danger); }

#paint { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: 86px; width: min(380px, calc(100% - 32px)); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
#paint header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#paint h2 { font-size: 16px; margin: 0; }
#paint p { margin: 0; color: var(--muted); font-size: 12px; }
#thumbs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.thumb { background: #fff; border: 2px solid transparent; border-radius: 8px; padding: 2px; cursor: pointer; aspect-ratio: 1; }
.thumb[aria-pressed="true"] { border-color: var(--accent); }
.thumb img { width: 100%; height: 100%; display: block; }
#pc { width: min(100%, 37vh); align-self: center; max-width: 100%; aspect-ratio: 1; background: #fff; border-radius: 10px; touch-action: none; cursor: crosshair; display: block; }
#swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); padding: 0; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
#paint footer { display: flex; gap: 8px; flex-wrap: wrap; }
#paint footer button { flex: 1; justify-content: center; }
@media (max-width: 640px) {
  #intro ol, #intro .note { display: none; }
  #paint { left: 16px; right: 16px; width: auto; top: auto; bottom: 0; max-height: 78%; border-radius: 16px 16px 0 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<canvas id="gl" aria-label="그림 캐릭터가 걸어 다니는 3D 농장"></canvas>

<section id="intro">
  <h1>그림 농장 3D</h1>
  <p>색칠한 그림이 입체 인형이 되어 농장을 걸어 다닙니다. 컨셉과 계절을 바꿔 보고, 캐릭터를 눌러 보세요.</p>
  <ol>
    <li><b>1</b>종이 배경을 지우고 그림만 오려냅니다</li>
    <li><b>2</b>그림의 윤곽을 따서 안쪽을 부풀립니다</li>
    <li><b>3</b>빛과 그림자가 있는 3D 공간에 내려놓습니다</li>
  </ol>
  <div class="note">원리를 보여주는 시연용입니다. 실제 서비스의 그래픽 수준과는 다릅니다.</div>
</section>

<div id="toast" role="status" hidden></div>

<section id="paint" hidden aria-label="화면에서 색칠하기">
  <header><h2>화면에서 색칠하기</h2><button id="paintClose" type="button">닫기</button></header>
  <p>도안을 고르고, 색을 고른 뒤 칠할 곳을 누르세요.</p>
  <div id="thumbs"></div>
  <canvas id="pc" width="512" height="512"></canvas>
  <div id="swatches"></div>
  <footer><button id="paintReset" type="button">다시 칠하기</button><button id="paintSend" type="button" class="primary">화면으로 보내기</button></footer>
</section>

<div id="dock">
  <div class="group">
    <label class="btn primary" for="file">그림 사진 올리기<input id="file" type="file" accept="image/*"></label>
    <button id="openPaint" type="button">화면에서 색칠하기</button>
    <button id="jump" type="button">모두 점프</button>
    <button id="wire" type="button" aria-pressed="false">입체 구조 보기</button>
  </div>
  <div class="group" id="kinds"><span>컨셉</span>
    <button type="button" data-k="farm" aria-pressed="true">A 농장</button>
    <button type="button" data-k="animals" aria-pressed="false">B 동물</button>
    <button type="button" data-k="road" aria-pressed="false">C 길</button>
  </div>
  <div class="group" id="seasons"><span>계절</span>
    <button type="button" data-s="spring" aria-pressed="false">봄</button>
    <button type="button" data-s="summer" aria-pressed="false">여름</button>
    <button type="button" data-s="autumn" aria-pressed="true">가을</button>
    <button type="button" data-s="winter" aria-pressed="false">겨울</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const toastEl = $("toast");
  let toastTimer = 0;
  function toast(msg, err) { toastEl.textContent = msg; toastEl.className = err ? "err" : ""; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (toastEl.hidden = true), err ? 5000 : 2200); }
  if (!window.THREE) { toast("3D 라이브러리를 불러오지 못했습니다. 네트워크를 확인하고 새로 고쳐 주세요.", true); return; }
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------------------------------------------------------- 그림 오려내기
  function toCanvas(src, max) {
    const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = Math.min(1, max / Math.max(w, h));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height); return c;
  }
  // 가장자리에서 종이색을 따라 번져 나가며 배경을 지우고, 남은 덩어리 중 가장 큰 것을 그림으로 본다.
  function extractDrawing(src) {
    const cv = toCanvas(src, 440), W = cv.width, H = cv.height, N = W * H;
    const px = cv.getContext("2d").getImageData(0, 0, W, H).data;
    const lum = new Float32Array(N), sat = new Float32Array(N);

    return Promise.all(KINDS[k].map(([n, x, z]) => sample(n, [x, z]))).catch(() => toast("예시 그림을 불러오지 못했습니다", true));
  }
  $("kinds").addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) setKind(b.dataset.k); });
  setKind("farm");
  window.__farm = { chars, addFrom, extractDrawing, spawn, tick, jump, sample, setKind, setSeason: (k) => { season = k; $("seasons").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.s === k))); } };
  if (!window.__capture) requestAnimationFrame(frame);
})();
</script>
