<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>블록 동물 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 화면 전체가 3D 무대. 조작은 아래 도크, 색칠은 오른쪽 패널(좁은 화면에서는 아래 시트). 어두운 무대 톤 하나로 고정. */
:root {
  color-scheme: dark;
  --bg: #10131a; --panel: rgba(17, 21, 29, 0.82); --panel-solid: #161b25; --line: rgba(255, 255, 255, 0.16);
  --fg: #f3efe6; --muted: #bdb7a9; --accent: #f2c14e; --accent-ink: #1c1606; --danger: #ffb4a2;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button, label.btn { font: inherit; color: var(--fg); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
button:hover, label.btn:hover { background: rgba(255, 255, 255, 0.14); }
button:focus-visible, label.btn:focus-within, .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary, label.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.primary:hover, label.btn.primary:hover { background: #ffd369; }
button[aria-pressed="true"] { background: var(--fg); color: #14171d; border-color: transparent; font-weight: 700; }
#intro { box-sizing: border-box; position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: min(340px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(8px); }
#intro h1 { font-size: 18px; margin: 0 0 4px; font-weight: 700; }
#intro p { margin: 0; color: var(--muted); line-height: 1.5; }
#intro ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
#intro ol b { color: var(--accent); font-weight: 700; margin-right: 6px; }
#intro .note { margin-top: 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
#dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center; background: linear-gradient(to top, rgba(10, 12, 17, 0.85), rgba(10, 12, 17, 0)); }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.group > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; }
#toast { box-sizing: border-box; position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; max-width: calc(100% - 32px); text-align: center; }
#toast.err { color: var(--danger); }
#paint { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100% - 32px)); max-height: calc(100% - 110px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
#paint header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#paint h2 { font-size: 16px; margin: 0; }
#paint p { margin: 0; color: var(--muted); font-size: 12px; }
#pc { width: 100%; max-width: 100%; aspect-ratio: 1024 / 640; background: #fff; border-radius: 10px; touch-action: none; cursor: crosshair; display: block; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.25); padding: 0; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
#paint footer { display: flex; gap: 8px; flex-wrap: wrap; }
#paint footer button { flex: 1; justify-content: center; }
@media (max-width: 640px) {
  #intro ol, #intro .note { display: none; }
  #paint { left: 16px; right: 16px; width: auto; top: auto; bottom: 0; max-height: 80%; border-radius: 16px 16px 0 0; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}
#paint { z-index: 20; }
#toast { z-index: 30; }
@media (max-width: 640px) {
  body.painting #dock { display: none; }
  #paint { max-height: 88%; }
  body.painting #intro { display: none; }
  #paint footer { position: sticky; bottom: 0; background: var(--panel-solid); padding-top: 8px; margin-top: -2px; }
  #paint footer button { min-height: 46px; }
}
</style>

<canvas id="gl" aria-label="블록 동물이 걸어 다니는 3D 농장"></canvas>

<section id="intro">
  <h1>블록 동물 3D</h1>
  <p>동물 그림 한 장을 색칠하면, 그 그림이 3D 동물의 몸이 됩니다. 다리를 움직이며 걷고, 누르면 뛰어오릅니다.</p>
  <ol>
    <li><b>1</b>모서리 표식을 찾아 사진 속 도안을 반듯하게 폅니다</li>
    <li><b>2</b>옆모습 그림을 3D 모델 양옆에 비추고, 가장자리 색을 등과 앞뒤로 잇습니다</li>
    <li><b>3</b>뼈대에 맞춰 다리와 꼬리를 움직입니다</li>
  </ol>
  <div class="note">3D 모델에 그림을 입히는 원리를 보여주는 시연용입니다. 실제 서비스에서는 더 정교한 모델을 쓸 수 있습니다.</div>
</section>

<div id="toast" role="status" hidden></div>

<section id="paint" hidden aria-label="화면에서 색칠하기">
  <header><h2>화면에서 색칠하기</h2><button id="paintClose" type="button">닫기</button></header>
  <div class="row" id="kinds"><span style="color:var(--muted);font-size:12px">도안</span>
    <button type="button" data-k="cow" aria-pressed="true">소</button>
    <button type="button" data-k="pig" aria-pressed="false">돼지</button>
    <button type="button" data-k="dog" aria-pressed="false">강아지</button>
  </div>
  <canvas id="pc" width="1024" height="640"></canvas>
  <div class="row" id="tools"><span style="color:var(--muted);font-size:12px">도구</span>
    <button type="button" data-t="fill" aria-pressed="true">부위 채우기</button>
    <button type="button" data-t="brush" aria-pressed="false">붓으로 그리기</button>
  </div>
  <div class="row" id="swatches"></div>
  <footer><button id="paintReset" type="button">다시 칠하기</button><button id="paintSend" type="button" class="primary">화면으로 보내기</button></footer>
</section>

<div id="dock">
  <div class="group">
    <label class="btn primary" for="file">도안 사진 올리기<input id="file" type="file" accept="image/*"></label>
    <button id="openPaint" type="button">화면에서 색칠하기</button>
    <button id="jump" type="button">모두 점프</button>
  </div>
  <div class="group" id="seasons"><span>계절</span>
    <button type="button" data-s="spring" aria-pressed="true">봄</button>
    <button type="button" data-s="summer" aria-pressed="false">여름</button>
    <button type="button" data-s="autumn" aria-pressed="false">가을</button>
    <button type="button" data-s="winter" aria-pressed="false">겨울</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 블록 동물 도안. 3D 모델의 옆모습을 그대로 한 장의 그림으로 그린다. 시연 페이지와 인쇄용 PDF가 같은 코드를 쓴다.
(function (root) {
  const AW = 1024, AH = 640, OFF = 50, SW = AW + OFF * 2, SH = AH + OFF * 2, K = 215, BASE = 560;
  // 인쇄 도안의 모서리 표식 중심(도안지 좌표). 순서: 왼쪽 위, 오른쪽 위, 왼쪽 아래, 오른쪽 아래
  const MARKS = [[30, 30], [SW - 30, 30], [30, SH - 30], [SW - 30, SH - 30]];
  const KO = { cow: "소", pig: "돼지", dog: "강아지" };
  const FONT = '"IBM Plex Sans KR", "Noto Sans CJK KR", "Malgun Gothic", sans-serif';
  // 모델 치수: body [폭, 높이, 길이], leg [굵기, 길이], head [폭, 높이, 깊이], snout [폭, 높이, 깊이, 높이 위치]
  const SHAPES = {
    cow: { body: [1.05, 0.95, 1.8], leg: [0.34, 0.8], head: [0.9, 0.85, 0.8], snout: [0.62, 0.36, 0.2, -0.2], ears: "side", horns: true, tail: [0.1, 0.8, 0.02], scale: 1.05 },
    pig: { body: [1.12, 0.92, 1.6], leg: [0.32, 0.48], head: [0.95, 0.85, 0.75], snout: [0.44, 0.34, 0.2, -0.1], ears: "top", tail: [0.12, 0.3, 0.5], scale: 1.05 },
    dog: { body: [0.8, 0.75, 1.5], leg: [0.26, 0.7], head: [0.8, 0.75, 0.75], snout: [0.42, 0.34, 0.36, -0.14], ears: "flop", nose: true, tail: [0.12, 0.6, -0.9], scale: 1.1 },
  };
  // 옆에서 본 각 부위의 자리. 모델 좌표(z: 뒤→앞, y: 아래→위)와 도안 픽셀 좌표를 함께 돌려준다.
  function layout(kind) {
    const S = SHAPES[kind], [, bh, bl] = S.body, [lw, lh] = S.leg, [, hh, hd] = S.head, [, sh, sd, sy] = S.snout;
    const cy = lh + bh * 0.72, cz = bl / 2 + hd * 0.28, lz = bl / 2 - lw / 2 - 0.04, tl = Math.max(S.tail[1], 0.45);
    const m = {
      tail: S.tail[2] < -0.5 ? { z0: -bl / 2 - 0.26, z1: -bl / 2 + 0.02, y0: lh + bh * 0.7, y1: lh + bh * 0.7 + tl } : { z0: -bl / 2 - 0.3, z1: -bl / 2 + 0.02, y0: lh + bh * 0.85 - tl, y1: lh + bh * 0.85 },
      legB: { z0: -lz - lw / 2, z1: -lz + lw / 2, y0: 0, y1: lh }, legF: { z0: lz - lw / 2, z1: lz + lw / 2, y0: 0, y1: lh },
      body: { z0: -bl / 2, z1: bl / 2, y0: lh, y1: lh + bh },
      head: { z0: cz - hd / 2, z1: cz + hd / 2, y0: cy - hh / 2, y1: cy + hh / 2 },
      ear: S.ears === "top" ? { z0: cz - 0.2, z1: cz + 0.14, y0: cy + hh / 2 - 0.02, y1: cy + hh / 2 + 0.3 } : S.ears === "side" ? { z0: cz - hd / 2 - 0.3, z1: cz - hd / 2 + 0.04, y0: cy + hh * 0.12, y1: cy + hh * 0.42 } : { z0: cz - 0.32, z1: cz + 0.02, y0: cy - 0.24, y1: cy + hh * 0.4 },
      snout: { z0: cz + hd / 2 - 0.02, z1: cz + hd / 2 + sd, y0: cy + sy - sh / 2, y1: cy + sy + sh / 2 },
    };
    let zmin = 9, zmax = -9; for (const r of Object.values(m)) { zmin = Math.min(zmin, r.z0); zmax = Math.max(zmax, r.z1); }
    const zc = (zmin + zmax) / 2, px = {};
    for (const [n, r] of Object.entries(m)) px[n] = { x: AW / 2 + (r.z0 - zc) * K, y: BASE - r.y1 * K, w: (r.z1 - r.z0) * K, h: (r.y1 - r.y0) * K };
    const order = S.ears === "side" ? ["tail", "legB", "legF", "body", "ear", "head", "snout"] : ["tail", "legB", "legF", "body", "head", "ear", "snout"];
    // 몸통에 입힐 때는 머리 그림과 겹치는 앞부분을 빼고 가져온다.
    const uv = Object.assign({}, px); if (px.head.x < px.body.x + px.body.w) uv.body = Object.assign({}, px.body, { w: px.head.x - px.body.x + 5 });
    return { px, uv, order, eye: { x: AW / 2 + (cz + hd * 0.16 - zc) * K, y: BASE - (cy + hh * 0.14) * K } };
  }
  function drawTemplate(x, kind) {
    const L = layout(kind); x.save(); x.lineJoin = "round"; x.lineWidth = 5; x.strokeStyle = "#222";
    for (const n of L.order) { const r = L.px[n]; x.fillStyle = "#fff"; x.fillRect(r.x, r.y, r.w, r.h); x.strokeRect(r.x, r.y, r.w, r.h); }
    x.fillStyle = "#222"; x.beginPath(); x.arc(L.eye.x, L.eye.y, 11, 0, 7); x.fill();
    x.fillStyle = "#666"; x.font = "500 17px " + FONT; x.textBaseline = "top"; x.fillText(KO[kind] + "를 마음껏 색칠해 주세요. 무늬를 그려 넣어도 좋아요.", 30, 598);
    x.restore();
  }
  function blobs(x, r, col, list) { x.save(); x.beginPath(); x.rect(r.x, r.y, r.w, r.h); x.clip(); x.fillStyle = col; for (const [fx, fy, rw, rh] of list) { x.beginPath(); x.ellipse(r.x + r.w * fx, r.y + r.h * fy, r.w * rw, r.h * rh, 0.4, 0, 7); x.fill(); } x.restore(); }
  // 예시로 미리 칠해 둔 그림. 부위가 겹치는 순서는 도안과 같다.
  function drawPreset(x, kind, variant) {
    const L = layout(kind), P = L.px, col = {}, after = [];
    if (kind === "cow") { const base = variant ? "#F3E3C8" : "#FBF8F1", spot = variant ? "#8A5A2B" : "#2E2E2E"; for (const n of L.order) col[n] = base; col.snout = "#F7B6C2"; col.ear = spot;
      after.push(["body", spot, [[0.2, 0.3, 0.14, 0.3], [0.55, 0.7, 0.16, 0.3], [0.8, 0.1, 0.12, 0.22], [0.42, 0.02, 0.1, 0.16]]], ["head", spot, [[0.2, 0.2, 0.25, 0.3]]], ["legB", spot, [[0.5, 0.95, 0.7, 0.1]]], ["legF", spot, [[0.5, 0.95, 0.7, 0.1]]]); }
    else if (kind === "pig") { for (const n of L.order) col[n] = "#F7B6C2"; col.snout = "#EE8FA3"; col.ear = "#EE8FA3";
      after.push(["head", "#EE8FA3", [[0.5, 0.72, 0.14, 0.12]]], ["legB", "#B5677A", [[0.5, 0.93, 0.7, 0.12]]], ["legF", "#B5677A", [[0.5, 0.93, 0.7, 0.12]]], ["body", "#EE8FA3", [[0.5, 1.0, 0.45, 0.2]]]); }
    else { const base = variant ? "#F2EDE4" : "#D9A066", dark = variant ? "#3B3B3B" : "#8A5A2B"; for (const n of L.order) col[n] = base; col.ear = dark; col.tail = dark; col.snout = variant ? "#F2EDE4" : "#FFF1D6";
      after.push(["body", dark, [[0.35, 0.05, 0.22, 0.4]]], ["legB", variant ? "#3B3B3B" : "#FFF1D6", [[0.5, 0.93, 0.7, 0.14]]], ["legF", variant ? "#3B3B3B" : "#FFF1D6", [[0.5, 0.93, 0.7, 0.14]]]); }
    for (const n of L.order) { const r = P[n]; x.fillStyle = col[n]; x.fillRect(r.x, r.y, r.w, r.h); const a = after.filter((k) => k[0] === n); for (const [, c, list] of a) blobs(x, r, c, list); }
  }
  // 인쇄용 도안지: 흰 바탕, 모서리 표식 네 개, 가운데에 그림
  function drawSheet(x, kind) {
    x.fillStyle = "#fff"; x.fillRect(0, 0, SW, SH);
    for (const [cx, cy] of MARKS) { x.fillStyle = "#000"; x.fillRect(cx - 18, cy - 18, 36, 36); x.fillStyle = "#fff"; x.fillRect(cx - 6, cy - 6, 12, 12); }
    x.save(); x.translate(OFF, OFF); drawTemplate(x, kind); x.restore();
  }
  const api = { AW, AH, OFF, SW, SH, MARKS, KO, SHAPES, layout, drawTemplate, drawPreset, drawSheet };
  if (typeof module !== "undefined") module.exports = api;
  root.TPL = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const toastEl = $("toast"); let toastTimer = 0;
  function toast(msg, err) { toastEl.textContent = msg; toastEl.className = err ? "err" : ""; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (toastEl.hidden = true), err ? 5500 : 2200); }
  if (!window.THREE) { toast("3D 라이브러리를 불러오지 못했습니다. 네트워크를 확인하고 새로 고쳐 주세요.", true); return; }
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TPL = window.TPL, AW = TPL.AW, AH = TPL.AH;

  // ---------------------------------------------------------------- 3D 무대
  const canvas = $("gl"); let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); } catch (e) { toast("이 기기에서는 3D 화면을 열 수 없습니다.", true); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xdfeedd, 26, 90);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
  const SEASONS = {
    spring: { top: 0x6fb4e6, mid: 0xbfe3f5, bot: 0xf4f7e8, fog: 0xdfeedd, ground: 0x64994a, grass: 0x86b85c, tree: 0x5fa657, sun: 0xfff2cc, sunI: 0.85, hemiS: 0xcfe8ff, hemiG: 0x7a9a5a, hemiI: 0.6, pcol: 0xf9b9cf, fall: 0.9, swing: 1.2, sunPos: [14, 18, 10] },
    summer: { top: 0x2f8fe0, mid: 0x8fd0f5, bot: 0xe8f6fb, fog: 0xd5eef5, ground: 0x3f8044, grass: 0x4f9a52, tree: 0x2f8545, sun: 0xfff6e0, sunI: 0.82, hemiS: 0xbfe4ff, hemiG: 0x4f8a4f, hemiI: 0.55, pcol: 0xffffff, fall: -0.15, swing: 0.5, sunPos: [8, 24, 8] },
    autumn: { top: 0x4c5f8e, mid: 0xe8a27a, bot: 0xfce0ae, fog: 0xf0c89a, ground: 0xb8893a, grass: 0xd9ae4e, tree: 0xc8642a, sun: 0xffc98a, sunI: 1.15, hemiS: 0xf2c9a0, hemiG: 0x8a6a2a, hemiI: 0.6, pcol: 0xe4672e, fall: 1.3, swing: 1.8, sunPos: [18, 9, 6] },
    winter: { top: 0x7f9cc4, mid: 0xc9d9ea, bot: 0xf2f6fa, fog: 0xe6eef5, ground: 0xd9e2ea, grass: 0xf2f6fa, tree: 0x4b7f68, sun: 0xeaf2ff, sunI: 0.72, hemiS: 0xdde9f5, hemiG: 0xc8d4e0, hemiI: 0.58, pcol: 0xffffff, fall: 1.0, swing: 0.8, sunPos: [10, 14, 12] },
  };
  let season = "spring";
  const C = (hex) => new THREE.Color(hex);
  const cur = { top: C(0), mid: C(0), bot: C(0), fog: C(0), ground: C(0), grass: C(0), tree: C(0), sun: C(0), hemiS: C(0), hemiG: C(0), pcol: C(0), sunI: 1, hemiI: 1, fall: 1, swing: 1, sunPos: new THREE.Vector3() };
  const COLOR_KEYS = ["top", "mid", "bot", "fog", "ground", "grass", "tree", "sun", "hemiS", "hemiG", "pcol"];
  function applySeason(k) { const s = SEASONS[season]; for (const key of COLOR_KEYS) cur[key].lerp(C(s[key]), k); for (const key of ["sunI", "hemiI", "fall", "swing"]) cur[key] += (s[key] - cur[key]) * k; cur.sunPos.lerp(new THREE.Vector3(...s.sunPos), k); }
  applySeason(1);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { top: { value: cur.top }, mid: { value: cur.mid }, bot: { value: cur.bot } },

  // ---------------------------------------------------------------- 사진 올리기: 모서리 표식 네 개로 도안을 반듯하게 편다
  function solve8(A, b) { const n = 8; for (let i = 0; i < n; i++) { let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r; if (Math.abs(A[p][i]) < 1e-9) return null; [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]]; for (let r = i + 1; r < n; r++) { const f = A[r][i] / A[i][i]; for (let c = i; c < n; c++) A[r][c] -= f * A[i][c]; b[r] -= f * b[i]; } } const x = new Array(n); for (let i = n - 1; i >= 0; i--) { let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c]; x[i] = s / A[i][i]; } return x; }
  function rectify(img) {

      while (st.length) { const i = st.pop(), x = i % w, y = (i / w) | 0; area++; cx += x; cy += y; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && !lab[i - 1] && lum[i - 1] < thr) { lab[i - 1] = 1; st.push(i - 1); } if (x < w - 1 && !lab[i + 1] && lum[i + 1] < thr) { lab[i + 1] = 1; st.push(i + 1); } if (i >= w && !lab[i - w] && lum[i - w] < thr) { lab[i - w] = 1; st.push(i - w); } if (i < N - w && !lab[i + w] && lum[i + w] < thr) { lab[i + w] = 1; st.push(i + w); } }
      const bw = x1 - x0 + 1, bh = y1 - y0 + 1, fill = area / (bw * bh);
      if (bw >= w * 0.012 && bw <= w * 0.07 && bh >= w * 0.012 && bh <= w * 0.07 && bw / bh > 0.6 && bw / bh < 1.67 && fill > 0.45 && fill < 0.98) cand.push({ x: (cx / area) * ds, y: (cy / area) * ds });
    }
    if (cand.length < 4) return null;
    const corners = [[0, 0], [W, 0], [0, H], [W, H]].map(([px, py]) => cand.reduce((a, c) => (Math.hypot(c.x - px, c.y - py) < Math.hypot(a.x - px, a.y - py) ? c : a)));
    if (new Set(corners).size < 4) return null;
    const quad = Math.abs((corners[1].x - corners[0].x) * (corners[2].y - corners[0].y) - (corners[2].x - corners[0].x) * (corners[1].y - corners[0].y)); if (quad < W * H * 0.12) return null;
    const M = TPL.MARKS, A = [], b = [];   // 도안 좌표 → 사진 좌표
    for (let i = 0; i < 4; i++) { const [u, v] = M[i], p = corners[i]; A.push([u, v, 1, 0, 0, 0, -p.x * u, -p.x * v]); b.push(p.x); A.push([0, 0, 0, u, v, 1, -p.y * u, -p.y * v]); b.push(p.y); }
    const hm = solve8(A, b); if (!hm) return null;
    const out = document.createElement("canvas"); out.width = AW; out.height = AH; const ox = out.getContext("2d"), od = ox.createImageData(AW, AH), o = od.data;
    for (let y = 0; y < AH; y++) for (let x = 0; x < AW; x++) { const u = x + TPL.OFF, v = y + TPL.OFF, den = hm[6] * u + hm[7] * v + 1, px = Math.round((hm[0] * u + hm[1] * v + hm[2]) / den), py = Math.round((hm[3] * u + hm[4] * v + hm[5]) / den), i = (y * AW + x) * 4;
      if (px < 0 || py < 0 || px >= W || py >= H) { o[i] = o[i + 1] = o[i + 2] = 255; o[i + 3] = 255; continue; } const j = (py * W + px) * 4; o[i] = sp[j]; o[i + 1] = sp[j + 1]; o[i + 2] = sp[j + 2]; o[i + 3] = 255; }

    const hist = [[], [], []]; for (let i = 0; i < AW * AH; i += 37) for (let c = 0; c < 3; c++) hist[c].push(o[i * 4 + c]);

  const loadImg = (url) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
  // 펴진 도안에서 어떤 동물 도안인지 알아낸다: 각 동물 도안의 테두리 선 자리가 실제로 어두운지 본다.

  }
  function addPhoto(im) { const flat = rectify(im); if (!flat) return null; const k = detectKind(flat); if (k !== kind) pick(k); return spawn(k, flat); }
  $("file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return; toast("도안의 표식을 찾는 중입니다");

    fr.onload = () => loadImg(fr.result).then((im) => { if (addPhoto(im)) toast(KO[kind] + "가 농장에 도착했습니다"); else toast("모서리 표식 네 개를 찾지 못했습니다. 도안 전체가 보이게 밝은 곳에서 찍어 주세요.", true); }).catch(() => toast("이 파일은 열 수 없습니다. 사진 파일을 올려 주세요.", true));
    fr.readAsDataURL(f); e.target.value = "";
  });
  $("jump").addEventListener("click", () => chars.forEach((c, i) => setTimeout(() => jump(c, 5.5 + Math.random() * 2.5), i * 70)));
  $("seasons").addEventListener("click", (e) => { const b = e.target.closest("button[data-s]"); if (!b) return; season = b.dataset.s; $("seasons").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });

  // 처음에는 미리 칠해 둔 예시 동물들이 농장에 있다.
  const preset = (k, v) => { const c = document.createElement("canvas"); c.width = AW; c.height = AH; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, AW, AH); TPL.drawPreset(x, k, v); x.globalCompositeOperation = "multiply"; const l = document.createElement("canvas"); l.width = AW; l.height = AH; TPL.drawTemplate(l.getContext("2d"), k); x.drawImage(l, 0, 0); return c; };
  [["cow", 0, -5.5, 1, 0.6], ["pig", 0, -1.5, 3, -0.4], ["dog", 0, 2.5, 0.5, 0.9], ["cow", 1, 6, -2.5, -0.8], ["dog", 1, -3, -3.5, 0.3]].forEach(([k, v, x, z, yaw]) => spawn(k, preset(k, v), [x, z, yaw]));

  if (!window.__capture) requestAnimationFrame(frame);
