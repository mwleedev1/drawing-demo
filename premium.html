<canvas id="gl" aria-label="색칠한 동물들이 지내는 3D 농장"></canvas>
<div id="guides" aria-hidden="true"></div>

<section id="intro">
  <h1>그림 농장 3D</h1>
  <p>색칠한 동물이 빛과 함께 농장에 내려와 지냅니다. 동물을 눌러 고른 뒤 아래 동작 버튼을 눌러 보세요.</p>
  <div class="note">화면 구성에서 빔프로젝터 4대를 이어 붙인 화면을 미리 볼 수 있습니다. 동물은 이어진 화면 안에서만 움직입니다.</div>
</section>

<div id="toast" role="status" hidden></div>

<section id="paint" hidden aria-label="화면에서 색칠하기">
  <header><h2>화면에서 색칠하기</h2><button id="paintClose" type="button">닫기</button></header>
  <div class="row" id="kinds"><span>도안</span>
    <button type="button" data-k="cow" aria-pressed="true">소</button>
    <button type="button" data-k="pig" aria-pressed="false">돼지</button>
    <button type="button" data-k="dog" aria-pressed="false">강아지</button>
  </div>
  <canvas id="pc" width="1024" height="640"></canvas>
  <div class="row" id="tools"><span>도구</span>
    <button type="button" data-t="fill" aria-pressed="true">부위 채우기</button>
    <button type="button" data-t="brush" aria-pressed="false">붓으로 그리기</button>
  </div>
  <div class="row" id="swatches"></div>
  <footer><button id="paintReset" type="button">다시 칠하기</button><button id="paintSend" type="button" class="primary">화면으로 보내기</button></footer>
</section>

<div id="dock">
  <div class="group">
    <label class="btn primary" for="file">도안 사진 올리기<input id="file" type="file" accept="image/*"></label>
    <button id="openPaint" type="button">화면에서 색칠하기</button>
    <button id="moreToggle" type="button" aria-expanded="false">동작·배경</button>
  </div>
  <div id="more">
    <div class="group" id="actions"><span id="actLabel">동작 (모두)</span></div>
    <div class="group" id="seasons"><span>계절</span>
      <button type="button" data-s="spring" aria-pressed="true">봄</button>
      <button type="button" data-s="summer" aria-pressed="false">여름</button>
      <button type="button" data-s="autumn" aria-pressed="false">가을</button>
      <button type="button" data-s="winter" aria-pressed="false">겨울</button>
    </div>
    <div class="group" id="times"><span>시간</span>
      <button type="button" data-t="day" aria-pressed="false">낮</button>
      <button type="button" data-t="sunset" aria-pressed="true">노을</button>
      <button type="button" data-t="night" aria-pressed="false">밤</button>
    </div>
    <div class="group" id="modes"><span>화면 구성</span>
      <button type="button" data-m="single" aria-pressed="true">화면 1개</button>
      <button type="button" data-m="wall4" aria-pressed="false">빔 4대 가로</button>
      <button type="button" data-m="grid4" aria-pressed="false">빔 4대 2×2</button>
      <button id="fs" type="button">전체 화면</button>
    </div>
  </div>
</div>

// ================================================================ 버튼
{

}
function setSeason(k) { seasonKey = k; paintFlowers(); sunflowers.visible = k !== "winter"; document.querySelectorAll("#seasons button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === k))); }

// ================================================================ 매 프레임
let T = 0, envTimer = 0, envLeft = 2;

  for (let i = 0; i < PN; i++) { let y = pPos[i * 3 + 1] - cur.fall * dt * (0.5 + (pSeed[i] % 1) * 0.7); if (y < 0) y += 14; if (y > 14) y -= 14; pPos[i * 3 + 1] = y; pPos[i * 3] += Math.sin(T * 1.1 + pSeed[i]) * dt * (part === 1 ? 0.2 : 0.7); pPos[i * 3 + 2] += Math.cos(T * 0.7 + pSeed[i]) * dt * 0.25; }

function render() { if (composer) composer.render(); else renderer.render(scene, camera); }

// ================================================================ 시작

})();
